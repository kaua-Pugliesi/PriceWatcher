services:
  postgres:
    image: postgres:16-alpine
    container_name: pricewatcher-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pricewatcher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pricewatcher"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pricewatcher-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pricewatcher
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: minha-chave-super-secreta-com-pelo-menos-32-bytes
    ports:
      - "8080:8080"

volumes:
  postgres_data:
